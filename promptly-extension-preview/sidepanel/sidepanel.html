<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promptly</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="head">
    <span id="head-brand"></span><span class="wm">promptly</span>
    <span class="grow"></span>
    <button id="lang" type="button" class="pillbtn" data-i18n-title="language"></button>
  </header>
  <main class="body">
    <div class="seg" id="tabs" role="tablist">
      <button type="button" role="tab" data-tab="now" class="on" data-i18n="tabNow"></button>
      <button type="button" role="tab" data-tab="library" data-i18n="tabLibrary"></button>
      <button type="button" role="tab" data-tab="drafts" data-i18n="tabDrafts"></button>
    </div>

    <section id="now" class="stack">
      <div class="label" data-i18n="justUsed"></div>
      <div id="used"></div>
      <div id="voteBox" class="stack" hidden>
        <div class="label" data-i18n="didItWork"></div>
        <div class="two">
          <button id="voteYes" type="button" class="btn sm"></button>
          <button id="voteNo" type="button" class="btn sm" data-i18n="voteNo"></button>
        </div>
        <p id="voteMsg" class="hint"></p>
      </div>
      <div id="resultBox" class="stack" hidden>
        <div class="label" data-i18n="shareResult"></div>
        <label id="drop" class="drop" tabindex="0">
          <img id="dropImg" alt="" hidden>
          <span id="dropText"></span>
          <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
        </label>
        <button id="sendResult" type="button" class="btn full" disabled data-i18n="sendResult"></button>
      </div>
      <div id="status" class="banner info"></div>
    </section>

    <section id="library" class="stack" hidden>
      <label class="field"><span id="search-ico"></span><input id="search" type="search" data-i18n-ph="searchPh" autocomplete="off"></label>
      <ul id="libList" class="list"></ul>
      <p id="libEmpty" class="empty" hidden></p>
    </section>

    <section id="drafts" class="stack" hidden>
      <ul id="draftList" class="list"></ul>
      <p id="draftEmpty" class="empty" hidden></p>
    </section>
  </main>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/store.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
