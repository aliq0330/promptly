<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promptly</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Giriş (OAuth taslağı) -->
  <main id="login" hidden>
    <div class="login-hero">
      <span id="login-brand"></span>
      <span class="wm big">promptly</span>
    </div>
    <h1 data-i18n="connectTitle"></h1>
    <p class="lead" data-i18n="connectLead"></p>
    <ul class="points">
      <li data-i18n="connectPt1"></li>
      <li data-i18n="connectPt2"></li>
      <li data-i18n="connectPt3"></li>
    </ul>
    <button id="connect" type="button" class="btn pri full" data-i18n="connectBtn"></button>
    <p class="hint center" data-i18n="connectMock"></p>
  </main>

  <!-- Ana ekran -->
  <div id="app" hidden>
    <header class="head">
      <span id="head-brand"></span>
      <span class="wm">promptly</span>
      <span class="grow"></span>
      <button id="lang" type="button" class="pillbtn" data-i18n-title="language"></button>
      <button id="signout" type="button" class="avatar" data-i18n-title="signOut">AL</button>
    </header>
    <div class="body">
      <div id="banner" class="banner" hidden></div>
      <label class="field" id="searchbox">
        <span id="search-ico"></span>
        <input id="search" type="search" data-i18n-ph="searchPh" autocomplete="off">
      </label>
      <div class="seg" id="tabs" role="tablist">
        <button type="button" role="tab" data-tab="library" class="on" data-i18n="tabLibrary"></button>
        <button type="button" role="tab" data-tab="drafts" data-i18n="tabDrafts"></button>
        <button type="button" role="tab" data-tab="pending"><span data-i18n="tabPending"></span><em id="pend-n" hidden></em></button>
      </div>
      <div class="chips" id="types"></div>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden></p>
    </div>
    <footer class="foot">
      <p id="shortcuts" class="hint"></p>
      <button id="sidepanel" type="button" class="btn sm full"></button>
      <label class="sim"><input id="offline" type="checkbox"> <span data-i18n="simOffline"></span></label>
    </footer>
  </div>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/store.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
