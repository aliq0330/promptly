<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Space tehlikeli bölge</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ayar.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="ay {{themeClass}}" style="width:390px;height:900px">
<div class="bar"><button type="button" class="back" aria-label="Geri"></button><div class="bt"><small>Space ayarları</small><b>Arşivle veya sil</b></div></div>
<div class="body">
<p class="s" style="margin:8px 20px 0">Yalnız Space sahibi görür.</p>

<div class="lab">Arşiv</div>
<div class="card">
<div class="row col"><div class="t">Space'i arşivle</div><div class="s">Arşivdeki Space salt okunur olur ve Arşiv sekmesine taşınır. İstediğin zaman geri alabilirsin.</div><button type="button" class="btn out">Arşivle</button></div>
</div>

<div class="lab">Tehlikeli bölge</div>
<div class="card">
<div class="row col"><div class="t">Space'i sil</div><div class="s">Tüm öğeler, panolar, paletler ve davetler kalıcı olarak silinir. Bu geri alınamaz.</div><button type="button" class="btn dng">Space'i sil</button></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() { return { themeClass: this.props.dark === false ? 'light' : 'dark' }; }
}
</script>
</body>
</html>
