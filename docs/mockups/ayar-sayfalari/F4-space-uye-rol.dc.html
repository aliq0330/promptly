<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Space üye rolü</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ayar.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="ay {{themeClass}}" style="width:390px;height:960px">
<div class="bar"><button type="button" class="back" aria-label="Geri"></button><div class="bt"><small>Üyeler ve davet</small><b>Can Yıldız</b></div><button type="button" class="bact off">Kaydet</button></div>
<div class="body">
<div class="hd"><span class="av lg" style="background:#0f766e">CY</span><div class="rt"><div class="t">Can Yıldız</div><div class="s">@can.yildiz</div></div></div>

<div class="lab">Rol</div>
<div class="opts">
<button type="button" class="opt on"><span class="rd"></span><span class="rt"><span class="t" style="display:block">Düzenleyici</span><span class="s" style="display:block">Öğe ekler, düzenler ve panoyu değiştirir.</span></span></button>
<button type="button" class="opt"><span class="rd"></span><span class="rt"><span class="t" style="display:block">Görüntüleyici</span><span class="s" style="display:block">Yalnız bakar; hiçbir şeyi değiştirmez.</span></span></button>
</div>

<div class="lab">Tehlikeli bölge</div>
<div class="card">
<div class="row col"><div class="t">Can Yıldız'ı çıkar</div><div class="s">Bu kişi Space'e erişimini kaybeder. Eklediği öğeler Space'te kalır.</div><button type="button" class="btn dng">Çıkar</button></div>
</div>
</div>
<div class="foot"><button type="button" class="btn off full">Rolü kaydet</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
renderVals() { return { themeClass: this.props.dark === false ? 'light' : 'dark' }; }
}
</script>
</body>
</html>
