<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Ekibi silme onayı</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ayar.css">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div class="ay {{themeClass}}" style="width:390px;height:900px">
<div class="bar"><button type="button" class="close" aria-label="Kapat"></button><div class="bt"><small>Sahiplik ve silme</small><b>«Ürün Tasarım Ekibi» silinsin mi?</b></div></div>
<div class="body">
<div style="padding:18px 20px 0"><p style="font-size:16px;line-height:24px">Ekip, 18 üyelik, 6 proje ve tüm kanallarıyla kalıcı olarak silinecek.</p></div>
<div class="lab">Seçenekler</div>
<div class="card">
<div class="row top"><div class="rt"><div class="t">Ekibin alanlarını da sil</div><div class="s">Kapalıyken projeler kişisel alana dönüşmez, ekip alanları silinir.</div></div><button type="button" class="tg" role="switch" aria-checked="false" aria-label="Space'leri de sil"><i></i></button></div>
</div>
<div class="lab">Onay</div>
<div class="card" style="padding-top:14px;padding-bottom:6px">
<label class="fl" for="es-ad">Onaylamak için ekip adını yaz</label>
<input id="es-ad" class="inp" placeholder="Ürün Tasarım Ekibi">
<p class="hint">Ürün Tasarım Ekibi</p>
</div>
</div>
<div class="foot"><button type="button" class="btn out full" style="flex:0 0 120px">Vazgeç</button><button type="button" class="btn dng full" style="opacity:.45">Ekibi sil</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() { return { themeClass: this.props.dark === false ? 'light' : 'dark' }; }
}
</script>
</body>
</html>
