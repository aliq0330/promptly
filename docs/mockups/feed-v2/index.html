<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Promptly Akış 2.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a presentation desk (sticky switcher on top) holding one real-size app frame per view,
   zoomed to fit. Inside the frame: Promptly "Meydan" tokens, copied from src/app/globals.css. */
:root {
  --bg: #f8f8fb; --surface: #ffffff; --soft: #f0f0f5; --elev: #ffffff;
  --text: #121218; --text2: #464854; --muted: #62646f;
  --border: #e4e4ec; --border-soft: #ececf2; --border-strong: #cfd0dc;
  --primary: #3b5be2; --primary-hover: #2e4bc9; --primary-soft: #eceffd; --on-primary: #ffffff;
  --secondary: #a64718; --heart: #d86934; --secondary-soft: #fbefe7;
  --success: #136f37; --success-soft: #e5f3ea;
  --shadow-rgb: 18 18 40; --sa: 1;
  --desk: #e9e9f0; --desk-line: #dcdce6; --bezel: #16151c;
  --av-bg: 87%; --av-fg: 30%; --av-sat: 55%;
  /* On-image ink: identical in both modes, images do not change with the theme. */
  --on-art: #ffffff; --on-art-muted: rgb(255 255 255 / .78); --art-chip: rgb(14 13 20 / .58);
  --scrim: linear-gradient(to top, rgb(10 9 16 / .82), rgb(10 9 16 / .35) 45%, rgb(10 9 16 / 0) 75%);
  --f-display: "Bricolage Grotesque", "DM Sans", system-ui, sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --shadow-card: 0 1px 2px rgb(var(--shadow-rgb) / calc(.04 * var(--sa))), 0 6px 20px rgb(var(--shadow-rgb) / calc(.05 * var(--sa)));
  --shadow-pop: 0 2px 6px rgb(var(--shadow-rgb) / calc(.06 * var(--sa))), 0 18px 48px rgb(var(--shadow-rgb) / calc(.12 * var(--sa)));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0a0f; --surface: #16151c; --soft: #1e1d26; --elev: #23222c;
    --text: #f3f3f7; --text2: #c8c8d3; --muted: #9a9aaa;
    --border: #2a2933; --border-soft: #201f28; --border-strong: #3a3946;
    --primary: #738cf0; --primary-hover: #93a6f4; --primary-soft: #1c2142; --on-primary: #0b0a0f;
    --secondary: #f29051; --heart: #f29051; --secondary-soft: #2c1d14;
    --success: #4ade80; --success-soft: #14261b;
    --shadow-rgb: 0 0 0; --sa: 4;
    --desk: #050408; --desk-line: #17161d; --bezel: #000000;
    --av-bg: 26%; --av-fg: 84%; --av-sat: 40%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0a0f; --surface: #16151c; --soft: #1e1d26; --elev: #23222c;
  --text: #f3f3f7; --text2: #c8c8d3; --muted: #9a9aaa;
  --border: #2a2933; --border-soft: #201f28; --border-strong: #3a3946;
  --primary: #738cf0; --primary-hover: #93a6f4; --primary-soft: #1c2142; --on-primary: #0b0a0f;
  --secondary: #f29051; --heart: #f29051; --secondary-soft: #2c1d14;
  --success: #4ade80; --success-soft: #14261b;
  --shadow-rgb: 0 0 0; --sa: 4;
  --desk: #050408; --desk-line: #17161d; --bezel: #000000;
  --av-bg: 26%; --av-fg: 84%; --av-sat: 40%;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--desk); color: var(--text); font-family: var(--f-body); font-size: 14px; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
h1, h2, h3, h4, p { margin: 0; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* ---------------- Presentation desk ---------------- */
.desk-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border-soft);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.desk-bar-in { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; max-width: 1560px; margin: 0 auto; }
.desk-brand { display: flex; align-items: center; gap: 8px; margin-right: auto; min-width: 0; }
.desk-brand b { font-family: var(--f-display); font-weight: 800; letter-spacing: -.045em; font-size: 20px; }
.desk-brand span { color: var(--muted); font-size: 13px; white-space: nowrap; }
.views { display: flex; gap: 4px; background: var(--soft); padding: 4px; border-radius: 999px; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.views button { height: 36px; padding: 0 14px; border-radius: 999px; font-weight: 500; color: var(--text2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.views button[aria-pressed="true"] { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-card); font-weight: 600; }
.desk-tools { display: flex; gap: 6px; }
.desk-tools button { height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); color: var(--text2); display: inline-flex; align-items: center; gap: 6px; font-weight: 500; white-space: nowrap; }
.desk-tools button:hover { border-color: var(--border-strong); color: var(--text); }
.desk-main { padding-block: 24px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.desk-note { max-width: 1560px; margin: 0 auto 18px; display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; }
.desk-note h1 { font-family: var(--f-display); font-weight: 700; font-size: 28px; letter-spacing: -.02em; text-wrap: balance; }
.desk-note p { color: var(--text2); max-width: 70ch; margin-top: 6px; line-height: 1.5; }
.desk-note .meta { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.stage { max-width: 1560px; margin: 0 auto; }
.stage.real { overflow-x: auto; }
.frame { margin: 0 auto; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow-pop); border: 1px solid var(--desk-line); background: var(--bg); }
.browser-top { height: 40px; background: var(--soft); border-bottom: 1px solid var(--border-soft); display: flex; align-items: center; gap: 8px; padding: 0 16px; }
.browser-top i { width: 11px; height: 11px; border-radius: 50%; background: var(--border-strong); }
.browser-top span { margin: 0 auto; background: var(--surface); border-radius: 8px; height: 26px; width: 420px; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.phones { display: grid; gap: 28px; justify-content: center; }
.phone-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.phone-cap { color: var(--text2); font-weight: 600; font-size: 13px; }
.phone { width: 390px; height: 844px; border-radius: 52px; border: 11px solid var(--bezel); background: var(--bg); position: relative; overflow: hidden; box-shadow: var(--shadow-pop); }
.phone-scroll { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; padding-bottom: 96px; }
.phone-scroll::-webkit-scrollbar { display: none; }

/* ---------------- App: shared atoms ---------------- */
.app { background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45; }
.ic { flex-shrink: 0; display: inline-block; vertical-align: middle; }
.av { border-radius: 50%; object-fit: cover; flex-shrink: 0; display: inline-grid; place-items: center; font-weight: 600;
  background: hsl(var(--h) var(--av-sat) var(--av-bg)); color: hsl(var(--h) 50% var(--av-fg)); }
.av-stack { display: inline-flex; }
.av-stack .av { box-shadow: 0 0 0 2px var(--surface); }
.av-stack .av + .av { margin-left: -8px; }
.btn { height: 40px; padding: 0 18px; border-radius: 999px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: background .2s; }
.btn-sm { height: 36px; padding: 0 14px; font-size: 13px; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-soft { background: var(--primary-soft); color: var(--primary); }
.btn-line { border: 1px solid var(--border); color: var(--text); background: var(--surface); }
.btn-text { color: var(--primary); font-weight: 600; font-size: 13px; }
.ib { width: 36px; height: 36px; border-radius: 999px; display: inline-grid; place-items: center; color: var(--text2); position: relative; }
.ib:hover { background: var(--soft); color: var(--text); }
.dot { position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--heart); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; box-shadow: 0 0 0 2px var(--surface); }
.chip { height: 32px; padding: 0 12px; border-radius: 999px; background: var(--soft); color: var(--text2); font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip.on { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.chip-line { background: transparent; border: 1px solid var(--border); }
.tags { display: flex; flex-wrap: wrap; gap: 6px 10px; }
.tags a { color: var(--text2); font-size: 13px; font-weight: 500; }
.tags a:hover { color: var(--primary); }
.label { font-size: 12px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.verified { color: var(--primary); }
.muted { color: var(--muted); }
.var { color: var(--secondary); font-weight: 600; }
.works { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--success-soft); color: var(--success); font-size: 12px; font-weight: 600; white-space: nowrap; }
.works span { font-weight: 500; opacity: .8; }
.art-chip { position: absolute; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--art-chip); color: var(--on-art); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.art-chip.tl { top: 14px; left: 14px; } .art-chip.tr { top: 14px; right: 14px; } .art-chip.br { bottom: 14px; right: 14px; }
.tool-logo { width: 18px; height: 18px; border-radius: 5px; background: #fff; display: inline-grid; place-items: center; flex-shrink: 0; }
.tool-logo img { width: 12px; height: 12px; }
.acts { display: flex; align-items: center; gap: 4px; }
.act { height: 36px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; color: var(--text2); font-weight: 500; font-variant-numeric: tabular-nums; }
.act:hover { background: var(--soft); color: var(--text); }
.act.liked { color: var(--heart); }
.act.saved { color: var(--primary); }
.sp { flex: 1; }
.card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 22px; box-shadow: var(--shadow-card); }
.ctx { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); min-width: 0; }
.ctx b { color: var(--text); font-weight: 600; white-space: nowrap; }
.ctx .why { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctx .ic-spark { color: var(--heart); }
.byline { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; }
.byline .nm { font-weight: 600; color: var(--text); white-space: nowrap; }
.byline .hd { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sep { color: var(--border-strong); }

/* ---------------- Desktop shell ---------------- */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 900px; }
.side { border-right: 1px solid var(--border-soft); background: var(--surface); }
.side-in { position: sticky; top: 0; padding: 20px 16px; display: flex; flex-direction: column; gap: 4px; min-height: 900px; }
.brand { display: flex; align-items: center; gap: 8px; padding: 4px 10px 18px; }
.brand b { font-family: var(--f-display); font-weight: 800; letter-spacing: -.045em; font-size: 24px; line-height: 1; }
.side .btn-primary { width: 100%; height: 44px; margin-bottom: 14px; }
.nav-h { font-size: 12px; font-weight: 600; color: var(--muted); padding: 16px 12px 6px; }
.nav a { height: 42px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 12px; color: var(--text2); font-weight: 500; font-size: 15px; }
.nav a:hover { background: var(--soft); color: var(--text); }
.nav a.on { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.nav a .cnt { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 500; }
.you { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 16px; border: 1px solid var(--border-soft); }
.you div { min-width: 0; line-height: 1.25; }
.you b { display: block; font-weight: 600; }
.you span { font-size: 12px; color: var(--muted); }
.topbar { height: 68px; display: flex; align-items: center; gap: 12px; padding: 0 32px; border-bottom: 1px solid var(--border-soft); background: var(--surface); }
.search { height: 44px; border-radius: 999px; background: var(--soft); display: flex; align-items: center; gap: 10px; padding: 0 16px; color: var(--muted); width: 460px; font-size: 14px; }
.search kbd { margin-left: auto; font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; color: var(--muted); background: var(--surface); }
.focus-btn { height: 40px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--text2); border: 1px solid var(--border); margin-left: auto; }
.body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; padding: 28px 32px 64px; align-items: start; }
.body.wide { grid-template-columns: minmax(0, 1fr); }
.feed { display: flex; flex-direction: column; gap: 28px; min-width: 0; max-width: 800px; width: 100%; justify-self: center; }
.feed-head { display: flex; align-items: flex-end; gap: 28px; border-bottom: 1px solid var(--border-soft); }
.tab { font-family: var(--f-display); font-size: 22px; font-weight: 700; letter-spacing: -.02em; color: var(--muted); padding-bottom: 12px; position: relative; }
.tab.on { color: var(--text); }
.tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; border-radius: 3px; background: var(--primary); }
.feed-head .ib { margin: 0 0 8px auto; }
.feed-head .ib + .ib { margin-left: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

/* Composer */
.composer { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.composer-row { display: flex; align-items: center; gap: 12px; }
.composer-input { flex: 1; height: 46px; border-radius: 999px; background: var(--soft); display: flex; align-items: center; padding: 0 18px; color: var(--muted); font-size: 15px; gap: 10px; min-width: 0; }
.composer-input span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.composer-types { display: flex; gap: 8px; flex-wrap: wrap; padding-left: 52px; }
.composer-types .chip { background: transparent; border: 1px solid var(--border); height: 34px; color: var(--text); }
.composer-types .chip .ic { color: var(--text2); }
.composer-types .chip:hover { border-color: var(--primary); color: var(--primary); }

/* Visual prompt — hero (unboxed, editorial) */
.vh { display: flex; flex-direction: column; gap: 14px; }
.vh-art { position: relative; border-radius: 22px; overflow: hidden; aspect-ratio: 4 / 3; background: var(--soft); }
.vh-art > img { width: 100%; height: 100%; object-fit: cover; }
.results { position: absolute; left: 14px; bottom: 14px; display: inline-flex; align-items: center; gap: 10px; background: var(--art-chip); color: var(--on-art); border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 12px; font-weight: 600; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.results .th { display: inline-flex; }
.results .th img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px rgb(14 13 20 / .6); }
.results .th img + img { margin-left: -8px; }
.vh-body { display: flex; flex-direction: column; gap: 12px; padding: 0 4px; }
.vh-head { display: flex; align-items: flex-start; gap: 16px; }
.vh-head h3 { font-family: var(--f-display); font-size: 30px; line-height: 1.08; letter-spacing: -.025em; font-weight: 700; text-wrap: balance; flex: 1; }
.pbox { font-family: var(--f-mono); font-size: 13px; line-height: 1.65; color: var(--text2); background: var(--soft); border-radius: 16px; padding: 12px 48px 12px 16px; position: relative; }
.pbox .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pbox .ib { position: absolute; top: 6px; right: 6px; }
.vh .acts { border-top: 1px solid var(--border-soft); padding-top: 10px; margin-top: 2px; }

/* Visual prompt — compact (grid) */
.vc { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.vc-art { position: relative; border-radius: 22px; overflow: hidden; background: var(--soft); }
.vc-art > img { width: 100%; height: 100%; object-fit: cover; }
.vc-art .ov { position: absolute; inset: auto 0 0 0; padding: 48px 16px 14px; background: var(--scrim); color: var(--on-art); display: flex; flex-direction: column; gap: 3px; }
.vc-art .ov small { font-size: 12px; font-weight: 600; color: var(--on-art-muted); display: flex; align-items: center; gap: 6px; }
.vc-art .ov b { font-family: var(--f-display); font-size: 19px; font-weight: 700; line-height: 1.15; letter-spacing: -.015em; text-wrap: balance; }
.vc-foot { display: flex; align-items: center; gap: 8px; padding: 0 2px; min-width: 0; }
.vc-foot .acts .act { height: 32px; padding: 0 8px; }
.play { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; border-radius: 50%; background: var(--art-chip); color: var(--on-art); display: grid; place-items: center; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

/* Text prompt */
.tp { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.tp-art { font-family: var(--f-mono); font-size: 13px; line-height: 1.7; color: var(--text2); background: var(--soft); border-radius: 16px; padding: 16px 18px; position: relative; max-height: 196px; overflow: hidden; }
.tp-art::after { content: ""; position: absolute; inset: auto 0 0 0; height: 56px; background: linear-gradient(to top, var(--soft), transparent); }
.tp-art > div { padding-left: 22px; text-indent: -22px; }
.tp-art .ln { color: var(--muted); user-select: none; display: inline-block; width: 22px; text-indent: 0; }
.tp h3, .rq h3, .wf h3, .sk h3, .spc h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
.tp h3 { font-size: 20px; line-height: 1.2; }
.tp-foot { display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--border-soft); padding-top: 10px; }

/* Request */
.rq { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.rq-top { display: flex; align-items: center; gap: 10px; }
.rq-top .who { min-width: 0; line-height: 1.3; font-size: 13px; }
.rq-top .who b { font-weight: 600; }
.status { height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; margin-left: auto; background: var(--success-soft); color: var(--success); }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.rq h3 { font-size: 21px; line-height: 1.22; }
.rq h3 .q { color: var(--primary); }
.rq p { color: var(--text2); line-height: 1.55; }
.refs { display: flex; gap: 8px; align-items: center; }
.refs img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; }
.refs .label { margin-right: 4px; }
.rq-foot { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--border-soft); padding-top: 12px; font-size: 13px; }
.rq-foot b { font-weight: 600; }

/* Workflow */
.wf { padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.wf-head { display: flex; gap: 14px; align-items: flex-start; }
.wf-head h3 { font-size: 24px; line-height: 1.15; margin-top: 4px; }
.wf-head .byline { margin-top: 8px; }
.chain { display: flex; align-items: flex-start; gap: 0; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.node { display: flex; flex-direction: column; gap: 8px; width: 120px; flex-shrink: 0; }
.node-tile { width: 120px; height: 120px; border-radius: 16px; background: var(--soft); position: relative; overflow: hidden; display: grid; place-items: center; color: var(--text2); border: 1px solid var(--border-soft); }
.node-tile > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.node-tile .n { position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); color: var(--text); font-size: 11px; font-weight: 700; display: grid; place-items: center; box-shadow: var(--shadow-card); z-index: 1; }

const VIEWS = [
  { id: "sana-ozel", label: "Sana Özel", icon: "house", w: 1440, render: screenHome, url: "promptly.app",
    title: "Ana Sayfa · Sana Özel", text: "Görsel ağırlıklı, karışık bir akış. Her içerik türünün kendi kart biçimi var: büyük görselli prompt, mono yazılı metin prompt, topluluk isteği, adım zinciri olan workflow, yaratıcı şeridi, Space ve Skill. Sağda dar bir keşif sütunu.", meta: "Masaüstü · 1440 px" },
  { id: "takip", label: "Takip Ettiklerin", icon: "users-round", w: 1440, render: screenFollowing, url: "promptly.app/?tab=following",
    title: "Ana Sayfa · Takip Ettiklerin", text: "Daha sade ve zamana göre. Kim ne yaptı cümlesi önde (paylaştı, güncelledi, alıntıladı), gün ayraçları, son paylaşanlar halkası ve Kişiler · Etiketler · Spaces süzgeci.", meta: "Masaüstü · 1440 px" },
  { id: "kesfet", label: "Keşfet", icon: "compass", w: 1440, render: screenDiscover, url: "promptly.app/discover",
    title: "Keşfet", text: "Ana Sayfa'dan farklı olarak bir dergi düzeni: büyük başlık, geniş arama, sıralama, sonra konu konu bölümler. Haftanın promptu iki kat büyük bir kapak olarak açılıyor; sağ sütun yok, içerik tüm genişliği kullanıyor.", meta: "Masaüstü · 1440 px" },
  { id: "tablet", label: "Tablet", icon: "layout-grid", w: 1024, render: screenTablet, url: "promptly.app",
    title: "Tablet · Sana Özel", text: "Kenar çubuğu 84 px etiketli raya iniyor, sağ sütun kalkıyor. Akış iki sütunlu ızgara; workflow ve yaratıcı şeridi iki sütunu birden kaplıyor.", meta: "Tablet · 1024 px" },
  { id: "mobil", label: "Mobil", icon: "user", w: 0, render: screenMobile,
    title: "Mobil", text: "Tek sütun, kenar boşluğu 12 px. Oluştur alanı tek satıra iniyor, süzgeçler kaydırılan çipler. Alt menü: Ana Sayfa, Keşfet, Oluştur, Spaces, Profil. Telefonların içi kaydırılabilir.", meta: "Telefon · 390 × 844" },
];
let state = { view: "sana-ozel", fit: true };
try { const f = localStorage.getItem("pm-fit"); if (f) state.fit = f === "1"; } catch (e) {}

function currentTheme() {
  const t = document.documentElement.getAttribute("data-theme");
  if (t) return t;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function renderChrome() {
  document.getElementById("deskBrand").innerHTML = `${mark(26)}<b>promptly</b><span>Akış 2.0 · tasarım mockup'ı, sahte veri</span>`;
  document.getElementById("views").innerHTML = VIEWS.map(v => `<button type="button" data-v="${v.id}" aria-pressed="${v.id === state.view}">${ic(v.icon, 16)}${v.label}</button>`).join("");
  document.getElementById("fitBtn").innerHTML = state.fit ? `${ic("layout-grid", 16)}Ekrana sığdır` : `${ic("eye", 16)}Gerçek boyut`;
  const dark = currentTheme() === "dark";
  document.getElementById("themeBtn").innerHTML = dark ? `${ic("sun", 16)}Açık mod` : `${ic("moon", 16)}Koyu mod`;
}
function render() {
  const v = VIEWS.find(x => x.id === state.view) || VIEWS[0];
  document.getElementById("noteTitle").textContent = v.title;
  document.getElementById("noteText").textContent = v.text;
  document.getElementById("noteMeta").textContent = v.meta;
  const stage = document.getElementById("stage");
  stage.className = "stage" + (state.fit ? "" : " real");
  stage.innerHTML = v.w
    ? `<div class="frame" data-w="${v.w}" style="width:${v.w}px"><div class="browser-top"><i></i><i></i><i></i><span>${v.url}</span></div>${v.render()}</div>`
    : v.render();
  renderChrome();
  fit();
}
function fit() {
  const stage = document.getElementById("stage");
  const avail = stage.clientWidth;
  const frame = stage.querySelector(".frame");
  if (frame) frame.style.zoom = state.fit ? Math.min(1, avail / (+frame.dataset.w + 2)) : 1;
  const phones = document.getElementById("phones");
  if (phones) {
    const W = 390, gap = 28;
    let n = 1, z = 1;
    for (let k = 4; k >= 1; k--) { const zz = Math.min(1, (avail - gap * (k - 1)) / (k * W)); if (zz >= .74 || k === 1) { n = k; z = zz; break; } }
    if (!state.fit) { z = 1; n = Math.max(1, Math.min(4, Math.floor((avail + gap) / (W + gap)))); }
    phones.style.gridTemplateColumns = `repeat(${n}, auto)`;
    phones.querySelectorAll(".phone-wrap").forEach(p => p.style.zoom = z);
  }
}
document.getElementById("views").addEventListener("click", e => {
  const b = e.target.closest("button[data-v]"); if (!b) return;
  location.hash = b.dataset.v;
});
document.getElementById("fitBtn").addEventListener("click", () => {
  state.fit = !state.fit; try { localStorage.setItem("pm-fit", state.fit ? "1" : "0"); } catch (e) {}
  render();
});
document.getElementById("themeBtn").addEventListener("click", () => {
  document.documentElement.setAttribute("data-theme", currentTheme() === "dark" ? "light" : "dark");
  renderChrome();
});
function fromHash() {
  const h = location.hash.slice(1);
  state.view = VIEWS.some(v => v.id === h) ? h : "sana-ozel";
  render(); window.scrollTo(0, 0);
}
addEventListener("hashchange", fromHash);
addEventListener("resize", fit);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", renderChrome);
/* Mock links inside the frames go nowhere. */
document.getElementById("stage").addEventListener("click", e => { const a = e.target.closest("a[href='#']"); if (a) e.preventDefault(); });
fromHash();
</script>
