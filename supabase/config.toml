# Supabase CLI ayarları — yalnızca `supabase functions deploy` için.
# Bu dosya veritabanı/Auth/Storage ayarı TAŞIMAZ (şema supabase/migrations/,
# canlı ayarlar Dashboard'dadır). Edge Function'ların JWT doğrulaması burada
# sabitlenir; fonksiyon kodu supabase/functions/ altındadır.

[functions.analyze-image]
verify_jwt = true

[functions.cleanup-orphan-storage]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

# Giriş yapmamış kullanıcı çağırdığı için JWT doğrulaması KAPALI olmalı.
[functions.username-login]
verify_jwt = false

# Açık API (salt-okunur, yalnız anon anahtar) — oturumsuz istemciler çağırdığı için JWT doğrulaması KAPALI (`docs/history/297-*`).
[functions.api]
verify_jwt = false

# İnternet üzerinden çalışan MCP (salt-okunur, yalnız anon anahtar, kimlik doğrulamasız bağlayıcı) — JWT doğrulaması KAPALI (`docs/history/299-*`).
[functions.mcp]
verify_jwt = false

# Promptly'nin kendi OAuth sunucusu (docs/history/317-*) — istemciler Supabase JWT'si taşımaz; JWT doğrulaması KAPALI, kimlik kontrolü veritabanı fonksiyonlarındadır.
[functions.oauth]
verify_jwt = false
