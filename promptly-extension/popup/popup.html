<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Promptly</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <span class="logo">✦</span>
      <h1>Promptly</h1>
      <span id="user" class="user" hidden></span>
      <button id="logout" type="button" class="link" hidden>Çıkış</button>
    </header>

    <main>
      <!-- Giriş -->
      <form id="login" class="stack" hidden>
        <p class="note">Promptları kaydetmek için Promptly hesabınla giriş yap.</p>
        <label class="label" for="identifier">E-posta veya kullanıcı adı</label>
        <input id="identifier" class="field" autocomplete="username" required />
        <label class="label" for="password">Şifre</label>
        <input id="password" class="field" type="password" autocomplete="current-password" required />
        <p id="login-error" class="error" role="alert" hidden></p>
        <button id="login-btn" type="submit" class="btn primary">Giriş yap</button>
      </form>

      <!-- Yakalama yok -->
      <section id="empty" class="empty" hidden>
        <p class="empty-title">Henüz yakalanan prompt yok</p>
        <p class="empty-hint">
          Herhangi bir sayfada bir prompt metnini seç, sağ tıkla ve
          <strong>“✦ Promptly'ye Kaydet”</strong> seçeneğini kullan.
        </p>
      </section>

      <!-- Kaydedildi -->
      <section id="done" class="empty" hidden>
        <p id="done-title" class="empty-title"></p>
        <p class="empty-hint"><a id="done-link" target="_blank" rel="noopener noreferrer"></a></p>
      </section>

      <!-- Yakalama + kaydetme -->
      <form id="capture" class="stack" hidden>
        <label class="label" for="title">Başlık</label>
        <input id="title" class="field" maxlength="120" required />

        <label class="label" for="text">Prompt</label>
        <textarea id="text" class="field mono" rows="7" spellcheck="false" required></textarea>
        <div class="meta">
          <span id="count"></span>
          <a id="source" target="_blank" rel="noopener noreferrer"></a>
        </div>

        <label class="label" for="type">İçerik türü</label>
        <select id="type" class="field">
          <option value="text">Metin</option>
          <option value="image">Görsel</option>
          <option value="video">Video</option>
          <option value="audio">Ses</option>
        </select>

        <label class="check"><input id="publish" type="checkbox" /> Hemen yayınla (aksi hâlde taslak)</label>

        <p id="save-error" class="error" role="alert" hidden></p>

        <div class="actions">
          <button id="copy" type="button" class="btn">Kopyala</button>
          <button id="clear" type="button" class="btn">Temizle</button>
          <button id="save" type="submit" class="btn primary">Kaydet</button>
        </div>
      </form>
    </main>

    <script src="../config.js"></script>
    <script src="../api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
