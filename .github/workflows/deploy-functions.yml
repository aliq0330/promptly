name: Deploy Edge Functions

# Yalnızca elle çalışır. Site deploy'undan (deploy.yml) tamamen ayrıdır: o iş
# bunu beklemez ve bunun başarısızlığı siteyi etkilemez.
on:
  workflow_dispatch:
    inputs:
      function:
        description: "Deploy only this function (default: all). Single-function deploys leave the others untouched."
        type: choice
        default: all
        options: [all, api, analyze-image, cleanup-orphan-storage, delete-account, username-login]

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require secrets
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              missing=1
            fi
          done
          exit $missing

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        run: ./scripts/deploy-functions.sh "${{ inputs.function || 'all' }}"
