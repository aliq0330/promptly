name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Static share pages (/share/…) are generated at build time from the public
  # content in Supabase, so a periodic rebuild keeps them in step with new posts.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # --- Veritabanı: migration + istemci TEK boru hattında (docs/history/226-*) ---------------------------------------
      # Sıra sabittir: yukarıdaki lint/tsc/test geçti → migration'lar uygulanır → canlı şemaya duman testi → derleme → yayın.
      # Migration uygulanamazsa ya da duman testi kırmızıysa aşağıdaki adımlar ÇALIŞMAZ, site eski haliyle kalır
      # ("istemci migration'dan önce yayınlandı" durumu yapısal olarak olamaz). Zamanlanmış 6 saatlik yeniden derlemede
      # migration uygulanmaz (yalnız duman testi koşar). Yıkıcı SQL (`drop table` vb.) `-- ci:allow-destructive` işareti olmadan durur.
      - name: Check migrations (naming, destructive SQL)
        run: node scripts/apply-migrations.mjs --check

      - name: Apply pending migrations
        if: github.event_name != 'schedule'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/apply-migrations.mjs

      - name: Smoke test against the live schema
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/smoke-test.mjs

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
