name: CI

# Pull request'lerde çalışır (deploy.yml yalnızca main'e itildiğinde çalışır). Amaç: migration + istemci değişikliği
# birleşmeden ÖNCE kırmızı yansın. Canlı veritabanına HİÇ dokunmaz (secret kullanmaz).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - name: Migration naming and destructive-SQL check
        run: node scripts/apply-migrations.mjs --check

  database:
    # Bütün migration'lar temiz bir PostgreSQL'e baştan oynatılır ve supabase/tests/*.sql çalışır (hepsi FAILED=0 olmalı).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      # fetch-depth 2: pull_request'te çıkış, taban + PR başının birleşim commit'idir; HEAD^1 = taban ucu, yani fark = bu PR'ın değişiklikleri.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # Yalnızca arayüz/belge değişen PR'larda SQL testleri (~9 dk) koşmaz. İş yine çalışıp başarı bildirir (atlanmış sayılmaz), yalnız aşağıdaki
      # adım koşullu. Fark okunamazsa güvenli yol: testler KOŞAR. `supabase/` (migration, test, seed, fonksiyon) ya da bu dosya değişince koşar.
      - name: Decide whether SQL tests are needed
        id: changes
        run: |
          run=true
          files=""
          if files=$(git diff --name-only HEAD^1 HEAD 2>/dev/null); then
            if printf '%s\n' "$files" | grep -qE '^(supabase/|\.github/workflows/ci\.yml$)'; then run=true; else run=false; fi
          else
            echo "::warning::Could not read the PR diff; running SQL tests to be safe."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Changed files:"; printf '%s\n' "$files"
          if [ "$run" = false ]; then echo "::notice::No supabase/ or ci.yml change in this PR, SQL tests skipped."; fi
      - name: Replay migrations and run SQL tests
        if: steps.changes.outputs.run == 'true'
        run: |
          set -u
          status=0
          for t in supabase/tests/*.sql; do
            case "$t" in *_local-stubs.sql) continue;; esac
            out=$(DB="ci_$(basename "$t" .sql | tr '-' '_')" supabase/tests/run-local.sh "$t" 2>&1) || { echo "$out"; status=1; continue; }
            echo "$out" | grep -E "MIGRATION FAILED|FAILED=|FAIL " || true
            if echo "$out" | grep -qE "MIGRATION FAILED|FAIL |FAILED=[1-9]"; then echo "::error::$t"; echo "$out" | tail -40; status=1; fi
          done
          exit $status

  ui:
    # Ağ taklitli arayüz paketlerinden hızlı bir kesit. Henüz bilgilendirici: kırmızı olması birleştirmeyi engellemez.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build (dummy Supabase URL, network is mocked)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
      - name: Run UI suites
        run: |
          set -o pipefail
          status=0
          for s in run-safety run-shared-cards run-detail-pages run-home-motion run-feed-filters run-search-notifications; do
            echo "== $s"; node tests/messaging-ui/$s.mjs | tail -3 || status=1
          done
          exit $status
